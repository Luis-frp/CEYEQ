# Configuracoes de Treinamento
interactive: false
model_name: "resnet50"
model_version: null

num_epochs: 30
batch_size: 16
learning_rate: 0.0001
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
image_size: [224, 224]
data_augmentation: true

# Folds
num_folds: 5
fold_idx: null
split_random_state: 42

# OneCycleLR e Early Stopping
early_stop_patience: 5
onecycle_pct_start: 0.1
onecycle_anneal_strategy: "cos"
onecycle_div_factor: 100.0
onecycle_final_div_factor: 10000.0
freeze_backbone_epochs: 0

# Diretorios de saida
save_dir: "${CGL_SAVE_DIR:-weights}"
viz_dir: "${CGL_VIZ_DIR:-vizualizacoes}"
arch_dir: "${CGL_ARCH_DIR:-arquiteturas}"
results_dir: "${CGL_RESULTS_DIR:-resultados}"

# Modelo
pretrained: true
num_classes: 3

# Defaults locais. No Kaggle, defina variaveis de ambiente antes de rodar:
# import os
# os.environ["CGL_DATA_ROOT"] = "/kaggle/input/seu-dataset/images"
# os.environ["CGL_METADATA_CSV"] = "/kaggle/input/seu-dataset/new_train_eyeq_v2.csv"
# os.environ["CGL_TEST_CSV"] = "/kaggle/input/seu-dataset/teste_processado.csv"
# No Colab com Google Drive, use cache local para nao ler imagens do Drive a cada batch:
# os.environ["CGL_LOCAL_CACHE_DIR"] = "/content/cgl_cache"

# environment:
#   CGL_DATA_ROOT: "data/images"
#   CGL_METADATA_CSV: "data/new_train_eyeq_v2.csv"
#   CGL_TEST_CSV: "data/teste_processado.csv"
#   CGL_LOCAL_CACHE_DIR: ""

data_dir: "${CGL_DATA_ROOT:-data/images}"
metadata_csv: "${CGL_METADATA_CSV:-data/new_train_eyeq_v2.csv}"
test_csv: "${CGL_TEST_CSV:-data/teste_processado.csv}"
local_cache_dir: "${CGL_LOCAL_CACHE_DIR:-}"
filepath_column: "image"
label_column: "quality"
class_name_column: null
